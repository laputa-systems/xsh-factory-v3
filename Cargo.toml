[workspace]
members = [
  "crates/factory-settings",
  "crates/factory-protocol",
  "crates/factory-tea-host",
  "crates/factory-kernel",
  "crates/factoryd",
  "crates/factoryctl",
]
default-members = [
  "crates/factory-protocol",
  "crates/factory-tea-host",
  "crates/factory-kernel",
  "crates/factoryd",
  "crates/factoryctl",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
blake3 = "=1.8.6"
fastrand = { version = "=2.5.0", default-features = false }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
miniserde = "=0.1.46"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
smol = "=2.0.2"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-smol", "tls-none", "migrate", "macros"] }
thiserror = "=2.0.20"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["ansi", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
